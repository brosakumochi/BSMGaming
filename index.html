<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロスタ最強総合攻略サイト</title>
    <style>
        /* 全体の基本デザイン（ブロスタをイメージしたダーク＆ゴールド） */
        body { font-family: 'Arial', sans-serif; background: #111424; color: #fff; margin: 0; padding: 20px; }
        header { text-align: center; background: #febb11; color: #000; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(254, 187, 17, 0.3); }
        header h1 { margin: 0; font-size: 28px; font-weight: 900; }
        header p { margin: 5px 0 0 0; font-weight: bold; }

        /* 3つのエリアを綺麗に並べるグリッド設定 */
        .main-layout { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } } /* スマホ対応 */

        .box { background: #1b203a; padding: 20px; border-radius: 8px; border: 2px solid #2d3561; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { color: #febb11; margin-top: 0; border-bottom: 2px solid #2d3561; padding-bottom: 10px; font-size: 20px; }

        /* 入力フォームやボタンのデザイン */
        select, input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; background: #252b4e; color: #fff; border: 1px solid #3d4780; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #febb11; color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { background: #e0a50f; }

        /* 掲示板の書き込みデザイン */
        .post-list { max-height: 300px; overflow-y: auto; background: #15192e; padding: 10px; border-radius: 4px; }
        .post-item { background: #252b4e; padding: 10px; border-radius: 4px; margin-bottom: 10px; border-left: 4px solid #febb11; }
        .post-name { font-weight: bold; color: #febb11; font-size: 14px; }
        .post-text { margin: 5px 0 0 0; font-size: 14px; }
    </style>
</head>
<body>

    <!-- ヘッダーエリア：チームの意気込み -->
    <header>
        <h1>🔥 ブロスタ最強総合攻略サイト 🔥</h1>
        <p>【活動休止中】裏で最強のサイトを自作して復活を待つページ</p>
    </header>

    <div class="main-layout">

        <!-- 1. 新キャラ・最速先行プレイ情報エリア -->
        <div class="box">
            <h2>📢 最速！新キャラ・イベント情報</h2>
            <p style="color: #aaa; font-size: 14px;">ここに次回アップデートの先行プレイ内容や、新キャラのステータスを自分たちの手で書き足していきます！</p>
            <div style="background: #252b4e; padding: 10px; border-radius: 4px; margin-bottom: 10px;">
                <b style="color: #ff4a4a;">【スクープ】</b> 新キャラクターの噂と先行プレイ情報をここにまとめる予定！
            </div>
            <div style="background: #252b4e; padding: 10px; border-radius: 4px;">
                <b style="color: #00ccff;">【イベント】</b> 今週末のガチバトル特別ルール・環境予想
            </div>
        </div>

        <!-- 2. AIピック・ドラフトエリア（見た目） -->
        <div class="box">
            <h2>🧠 AIピックシミュレーター</h2>
            <label>ゲームモードを選択:</label>
            <select>
                <option>ガチバトル（エメラルドハント）</option>
                <option>ガチバトル（ホットゾーン）</option>
                <option>ガチバトル（強奪）</option>
                <option>ガチバトル（ノックアウト）</option>
            </select>

            <label>敵のピックキャラ:</label>
            <input type="text" placeholder="例: モーティス、コルト">
<button onclick="askAI()">AIピックを作動させる</button>
<div id="aiResponse" style="background: #252b4e; padding: 15px; margin-top: 15px; border-radius: 4px; display: none;">
    <b style="color: #febb11;">🤖 AIコーチの提案:</b>
    <p id="aiText">計算中...</p>
</div>
        <!-- 3. 色んな人が書き込める攻略掲示板（見た目） -->
        <div class="box">
            <h2>💬 みんなの攻略雑談掲示板</h2>
            <input type="text" id="nameInput" placeholder="名前（匿名可）">
            <textarea id="textInput" placeholder="「このマップのカウンターは？」「この編成どう？」など自由に書こう！" rows="3"></textarea>
            <button onclick="addPost()">書き込む</button>

            <p style="font-size: 12px; color: #aaa; margin-top: 15px;">【最新の書き込み】</p>
            <div class="post-list" id="postList">
                <div class="post-item">
                    <div class="post-name">管理人</div>
                    <div class="post-text">一から作った俺たちのサイトへようこそ！自由に書き込んでね。</div>
                </div>
            </div>
        </div>

    </div>

    <!-- 掲示板に文字が追加される簡易的なJavaScriptプログラム（おまけ） -->
    <script>
        function addPost() {
            var name = document.getElementById('nameInput').value || 'アノニマス';
            var text = document.getElementById('textInput').value;
            if(!text) { alert('メッセージを入力してください！'); return; }
            
            var postList = document.getElementById('postList');
            var newPost = document.createElement('div');
            newPost.className = 'post-item';
            newPost.innerHTML = '<div class="post-name">' + name + '</div><div class="post-text">' + text + '</div>';
            
            postList.insertBefore(newPost, postList.firstChild);
            document.getElementById('textInput').value = '';
        }
    </script>

</body>
</html>
